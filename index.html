<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>5 Letter Social Club</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --container-bg: white;
            --text-primary: #333;
            --text-secondary: #666;
            --text-muted: #888;
            --text-placeholder: #aaa;
            --border-color: #e0e0e0;
            --border-divider: #eee;
            --input-bg: white;
            --word-tag-bg: #f8f8f8;
            --word-tag-hover: #fff3cd;
            --footer-text: rgba(255, 255, 255, 0.7);
            --footer-link: rgba(255, 255, 255, 0.9);
        }

        [data-theme="dark"] {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --container-bg: #1e1e2e;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #888;
            --text-placeholder: #666;
            --border-color: #3a3a4a;
            --border-divider: #2a2a3a;
            --input-bg: #2a2a3a;
            --word-tag-bg: #2a2a3a;
            --word-tag-hover: #3a3a2a;
            --footer-text: rgba(255, 255, 255, 0.6);
            --footer-link: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            transition: background 0.3s ease;
        }

        .container {
            background: var(--container-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--word-tag-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            border-color: var(--bg-gradient-start);
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 1.8rem;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 .club-number {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        [data-theme="dark"] h1 .club-number {
            background: linear-gradient(135deg, #a78bfa 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 24px;
            font-size: 1.5rem;
            border: 3px solid var(--border-color);
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-align: center;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
        }

        input[type="text"]:focus::placeholder {
            color: transparent;
        }

        input[type="text"]::placeholder {
            letter-spacing: 2px;
            text-transform: none;
            color: var(--text-placeholder);
        }

        .result {
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result.used {
            background: #fee2e2;
            color: #dc2626;
            border: 2px solid #fca5a5;
            display: block;
        }

        .result.safe {
            background: #d1fae5;
            color: #059669;
            border: 2px solid #6ee7b7;
            display: block;
        }

        .result.invalid {
            background: #fef3c7;
            color: #d97706;
            border: 2px solid #fcd34d;
            display: block;
        }

        .result.not-a-word {
            background: #f3e8ff;
            color: #7c3aed;
            border: 2px solid #c4b5fd;
            display: block;
        }

        .result.checking {
            background: #f0f9ff;
            color: #0369a1;
            border: 2px solid #7dd3fc;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #7dd3fc;
            border-top-color: #0369a1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .word-display {
            font-size: 1.8rem;
            letter-spacing: 6px;
            margin: 10px 0;
        }

        .stats {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-divider);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .update-info {
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--text-placeholder);
        }

        footer {
            margin-top: 20px;
            color: var(--footer-text);
            font-size: 0.8rem;
        }

        footer a {
            color: var(--footer-link);
        }

        .word-list-container {
            background: var(--container-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            width: 100%;
            margin-top: 30px;
        }

        .word-list-header {
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .word-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            line-height: 1.8;
        }

        .word-tag {
            display: inline-block;
            padding: 4px 10px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            font-size: 0.85rem;
            color: var(--text-primary);
            background: var(--word-tag-bg);
            border-left: 3px solid var(--border-color);
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .word-tag:hover {
            background: var(--word-tag-hover);
            border-left-color: #ffc107;
            cursor: default;
        }

        .word-tag.highlighted {
            background: var(--word-tag-hover);
            border-left-color: #ff9800;
            font-weight: 600;
        }

        .word-list-search {
            margin-bottom: 20px;
        }

        .word-list-search input {
            padding: 10px 16px;
            font-size: 0.9rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            width: 200px;
            outline: none;
            transition: border-color 0.3s;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .word-list-search input:focus {
            border-color: #667eea;
        }

        .word-list-search input::placeholder {
            color: var(--text-placeholder);
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
            <span id="themeIcon">&#9790;</span>
        </button>
        <h1><span class="club-number">5</span> Letter Social Club</h1>
        <p class="subtitle">Check if a word has already been used</p>

        <div class="search-box">
            <input
                type="text"
                id="wordInput"
                placeholder="Type a word..."
                maxlength="5"
                autocomplete="off"
                autofocus
            >
        </div>

        <div id="result" class="result"></div>

        <div class="stats">
            <span id="wordCount">0</span> words have been used so far
        </div>

        <div class="update-info">
            Last updated: <span id="lastUpdated">Loading...</span>
        </div>
    </div>

    <div class="word-list-container">
        <div class="word-list-header">All Used Words</div>
        <div class="word-list-search">
            <input type="text" id="filterInput" placeholder="Filter words..." autocomplete="off">
        </div>
        <div id="wordList" class="word-list"></div>
    </div>

    <footer>
        No ads. No tracking. Just answers.
    </footer>

    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        function setTheme(isDark) {
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeIcon.innerHTML = isDark ? '&#9728;' : '&#9790;';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            // Update meta theme-color for mobile browsers
            document.querySelector('meta[name="theme-color"]').setAttribute(
                'content', isDark ? '#1a1a2e' : '#667eea'
            );
        }

        // Check for saved theme preference or system preference
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        setTheme(savedTheme === 'dark' || (!savedTheme && prefersDark));

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            setTheme(!isDark);
        });

        // DOM elements
        const wordInput = document.getElementById('wordInput');
        const resultDiv = document.getElementById('result');
        const wordCountSpan = document.getElementById('wordCount');
        const lastUpdatedSpan = document.getElementById('lastUpdated');

        // Update word count
        wordCountSpan.textContent = usedWords.size;

        // Set last updated date (this should be updated when you add new words)
        lastUpdatedSpan.textContent = "January 21, 2026";

        // Cache for dictionary lookups
        const wordCache = new Map();
        let currentCheckId = 0;

        // Check if word exists in dictionary using multiple APIs with fallbacks
        async function isValidWord(word) {
            const lowerWord = word.toLowerCase();

            // Check cache first
            if (wordCache.has(lowerWord)) {
                return wordCache.get(lowerWord);
            }

            // If word is in our used words list, it's definitely valid
            if (usedWords.has(word.toUpperCase())) {
                wordCache.set(lowerWord, true);
                return true;
            }

            // Try multiple dictionary APIs with fallbacks
            const apis = [
                `https://api.dictionaryapi.dev/api/v2/entries/en/${lowerWord}`,
                `https://api.datamuse.com/words?sp=${lowerWord}&max=1`
            ];

            for (const apiUrl of apis) {
                try {
                    const response = await fetch(apiUrl);
                    if (response.ok) {
                        const data = await response.json();
                        // Datamuse returns an array, check if word matches exactly
                        if (apiUrl.includes('datamuse')) {
                            const isValid = data.length > 0 && data[0].word === lowerWord;
                            if (isValid) {
                                wordCache.set(lowerWord, true);
                                return true;
                            }
                        } else {
                            // Dictionary API returns data if word exists
                            wordCache.set(lowerWord, true);
                            return true;
                        }
                    }
                } catch (error) {
                    // Try next API
                    continue;
                }
            }

            // If all APIs fail or return no results, assume invalid
            // But use a basic check: if it looks like a word (all letters), give benefit of doubt
            wordCache.set(lowerWord, false);
            return false;
        }

        // Check word function
        async function checkWord(word) {
            const cleanWord = word.trim().toUpperCase();
            const checkId = ++currentCheckId;

            // Clear result if empty
            if (cleanWord.length === 0) {
                resultDiv.className = 'result';
                resultDiv.innerHTML = '';
                return;
            }

            // Check if valid 5-letter word
            if (cleanWord.length !== 5) {
                resultDiv.className = 'result invalid';
                resultDiv.innerHTML = `
                    <div class="result-icon">⚠️</div>
                    <div>Words must be exactly 5 letters</div>
                `;
                return;
            }

            // Check if only letters
            if (!/^[A-Z]+$/.test(cleanWord)) {
                resultDiv.className = 'result invalid';
                resultDiv.innerHTML = `
                    <div class="result-icon">⚠️</div>
                    <div>Please use only letters (A-Z)</div>
                `;
                return;
            }

            // FIRST: Check if word has been used (no API needed, instant)
            if (usedWords.has(cleanWord)) {
                resultDiv.className = 'result used';
                resultDiv.innerHTML = `
                    <div class="result-icon">X</div>
                    <div class="word-display">${cleanWord}</div>
                    <div>Already used</div>
                `;
                return;
            }

            // Show checking state for dictionary lookup
            resultDiv.className = 'result checking';
            resultDiv.innerHTML = `
                <div class="spinner"></div>
                <div class="word-display">${cleanWord}</div>
                <div>Checking dictionary...</div>
            `;

            // Check if it's a valid English word
            const isValid = await isValidWord(cleanWord);

            // Make sure this is still the current check (user might have typed more)
            if (checkId !== currentCheckId) return;

            if (!isValid) {
                resultDiv.className = 'result not-a-word';
                resultDiv.innerHTML = `
                    <div class="result-icon">?</div>
                    <div class="word-display">${cleanWord}</div>
                    <div>Not a recognized English word</div>
                `;
            } else {
                resultDiv.className = 'result safe';
                resultDiv.innerHTML = `
                    <div class="result-icon">✓</div>
                    <div class="word-display">${cleanWord}</div>
                    <div>Valid word - NOT used yet!</div>
                `;
            }
        }

        // Debounce function to avoid too many API calls
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Debounced check function
        const debouncedCheck = debounce((value) => checkWord(value), 300);

        // Event listener for input
        wordInput.addEventListener('input', (e) => {
            const value = e.target.value.trim();
            // Only debounce when we have 5 letters (API call needed)
            if (value.length === 5 && /^[a-zA-Z]+$/.test(value)) {
                debouncedCheck(value);
            } else {
                checkWord(value);
            }
        });

        // Also check on Enter key (immediate, no debounce)
        wordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkWord(wordInput.value);
            }
        });

        // Word list display
        const wordListDiv = document.getElementById('wordList');
        const filterInput = document.getElementById('filterInput');
        const wordsArray = Array.from(usedWords).sort();

        function renderWordList(filter = '') {
            const filterUpper = filter.toUpperCase();
            const filteredWords = filterUpper
                ? wordsArray.filter(word => word.includes(filterUpper))
                : wordsArray;

            wordListDiv.innerHTML = filteredWords
                .map(word => `<span class="word-tag">${word}</span>`)
                .join('');
        }

        // Initial render
        renderWordList();

        // Filter functionality
        filterInput.addEventListener('input', (e) => {
            renderWordList(e.target.value);
        });
